name: ci

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: backend

env:
  TEST_DATABASE_URL: postgresql://lifeos:lifeos@localhost:5432/lifeos_test
  TEST_REDIS_URL: redis://localhost:6379/15
  REQUIRE_SERVICES: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pyright

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest tests/unit

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: lifeos, POSTGRES_PASSWORD: lifeos, POSTGRES_DB: lifeos_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lifeos -d lifeos_test" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      # Full suite with coverage: domain logic is exercised by unit AND integration tests, so the
      # coverage gate (R24.4) must evaluate the combined run.
      - run: uv run pytest --cov --cov-report=json:coverage.json
      - run: uv run python scripts/check_coverage.py coverage.json

  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      # exit code 5 = no tests collected (graph tests arrive in M12)
      - run: uv run pytest tests/graph || [ $? -eq 5 ]

