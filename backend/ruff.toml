target-version = "py311"
line-length = 110
src = ["src", "tests", "eval", "scripts"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "PT", "DTZ", "TID"]
ignore = [
    "S101",   # assert is the pytest idiom
    "RUF001", "RUF002", "RUF003",  # unicode punctuation in docstrings/comments (→, ≤, –)
]

[lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PT012"]   # test secrets; raises-blocks wrap a whole transaction (violations surface at commit)
"src/lifeos/db/models.py" = ["E501"]   # generated mapping (sqlacodegen), kept one column per line

[lint.flake8-tidy-imports.banned-api]
"langchain_community".msg = "Use dedicated integration packages (design §37, langchain-dependencies skill)."
"datetime.datetime.utcnow".msg = "Use a timezone-aware clock (lifeos.domain.timeutil / Clock)."

[format]
quote-style = "double"
